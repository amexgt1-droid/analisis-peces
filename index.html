
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analizador Estadístico de Rondas y Multiplicadores</title>

<style>
:root { color-scheme: dark; }

* {
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1a1a24;
    color: #e2e8f0;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
    margin: 8px 0 28px;
    color: #f8fafc;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
    max-width: 1150px;
    margin: auto;
}

.panel {
    background: #242538;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #0005;
    min-width: 0;
}

h2 {
    margin-top: 0;
    color: #818cf8;
    border-bottom: 2px solid #313244;
    padding-bottom: 10px;
    font-size: 1.2rem;
}

.form-group {
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
    color: #aab4c5;
}

input, select {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #3b3d54;
    background: #1c1d2c;
    color: white;
    font: inherit;
}

input[type="file"] {
    padding: 7px;
}

button {
    width: 100%;
    background: #6366f1;
    color: white;
    border: 0;
    padding: 12px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1rem;
    margin: 5px 0;
    transition: background .2s;
}

button:hover {
    background: #4f46e5;
}

.btn-danger {
    background: #dc4040;
}

.btn-danger:hover {
    background: #b91c1c;
}

ul {
    list-style: none;
    padding: 0;
    max-height: 430px;
    overflow-y: auto;
}

li.record {
    background: #1c1d2c;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 8px;
    border-left: 5px solid #6366f1;
    display: flex;
    align-items: center;
    gap: 14px;
    overflow-wrap: anywhere;
}

.captured-preview {
    width: 90px;
    height: 70px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid #3b3d54;
    background: #242538;
    flex-shrink: 0;
}

.badge {
    font-weight: bold;
    padding: 4px 8px;
    border-radius: 4px;
    color: #111;
    display: inline-block;
}

.Rojo { background: #f87171; }
.Naranja { background: #fb923c; }
.Azul { background: #60a5fa; }

.prediction-box {
    background: #1c1d2c;
    padding: 15px;
    border-radius: 8px;
    border-left: 5px solid #10b981;
    font-size: 1rem;
    line-height: 1.7;
    margin-bottom: 20px;
}

.search-box {
    border: 1px solid #6366f1;
    margin-bottom: 12px;
}

.highlight {
    color: #34d399;
    font-weight: bold;
}

.info-container {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
}

.empty {
    background: #1c1d2c;
    padding: 14px;
    border-radius: 8px;
    color: #aab4c5;
}

.small {
    font-size: .9rem;
    color: #aab4c5;
}

@media (max-width: 760px) {
    body { padding: 12px; }
    .dashboard { grid-template-columns: 1fr; }
    .panel { padding: 15px; }
    h1 { font-size: 1.5rem; }
}
</style>
</head>

<body>

<h1>📊 Analizador Estadístico de Rondas y Multiplicadores</h1>

<div class="dashboard">

    <section class="panel">
        <h2>📥 Registrar ronda ejecutada</h2>

        <div class="form-group">
            <label for="jugadorInput">Nombre del jugador / personaje:</label>
            <input type="text" id="jugadorInput"
                   placeholder="Ej. Mickey, Chica"
                   maxlength="80" required>
        </div>

        <div class="form-group">
            <label for="horaInput">Hora exacta del tiro:</label>
            <input type="time" id="horaInput" value="07:00" required>
        </div>

        <div class="form-group">
            <label for="tipoPez">Tipo de multiplicador obtenido:</label>
            <select id="tipoPez">
                <option value="Rojo">Multiplicador rojo 🔴</option>
                <option value="Naranja">Multiplicador naranja 🟠</option>
                <option value="Azul">Multiplicador azul 🔵</option>
            </select>
        </div>

        <div class="form-group">
            <label for="valorInput">Puntos totales conseguidos:</label>
            <input type="number" id="valorInput"
                   placeholder="Ej. 1500" min="0" step="1" required>
        </div>

        <div class="form-group">
            <label for="fotoInput">Captura de pantalla (opcional):</label>
            <input type="file" id="fotoInput" accept="image/*">
            <p class="small">
                Las imágenes grandes pueden ocupar mucho espacio.
            </p>
        </div>

        <button type="button" id="agregarBtn">
            Ingresar al registro
        </button>

        <button type="button" class="btn-danger" id="borrarBtn">
            ⚠️ Reiniciar base de datos
        </button>
    </section>

    <section class="panel">
        <h2>🔮 Estimación general de tiempos</h2>

        <div class="prediction-box" id="prediccionBox" aria-live="polite">
            Ingresa al menos 2 registros para estimar el intervalo entre rondas.
        </div>

        <h2>🔍 Filtrar historial por jugador</h2>

        <input type="search" id="buscadorInput"
               class="search-box"
               placeholder="Escribe un nombre para filtrar..."
               aria-label="Buscar jugador">

        <ul id="listaHistorial"></ul>
    </section>

</div>

<script>
'use strict';

const STORAGE_KEY = 'analisisJugadoresMultiplicadores';

const PLACEHOLDER_IMAGE =
    'data:image/svg+xml;charset=UTF-8,' +
    encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="180" height="140">' +
        '<rect width="100%" height="100%" fill="#242538"/>' +
        '<text x="50%" y="50%" fill="#aab4c5" font-size="14" ' +
        'text-anchor="middle" dominant-baseline="middle">Sin captura</text>' +
        '</svg>'
    );

const $ = id => document.getElementById(id);

let datos = cargarDatos();

function cargarDatos() {
    try {
        const guardados = JSON.parse(
            localStorage.getItem(STORAGE_KEY) || '[]'
        );

        if (!Array.isArray(guardados)) return [];

        return guardados
            .filter(x =>
                x &&
                typeof x.jugador === 'string' &&
                typeof x.hora === 'string' &&
                ['Rojo', 'Naranja', 'Azul'].includes(x.tipo) &&
                Number.isFinite(Number(x.valor)) &&
                Number(x.valor) >= 0
            )
            .map(x => ({
                jugador: x.jugador,
                hora: x.hora,
                tipo: x.tipo,
                valor: Number(x.valor),
                foto: typeof x.foto === 'string'
                    ? x.foto
                    : PLACEHOLDER_IMAGE,
                creado: Number.isFinite(x.creado)
                    ? x.creado
                    : 0
            }));

    } catch (e) {
        return [];
    }
}

function convertirAMPM(hora24) {
    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(hora24)) {
        return hora24 || '';
    }

    const [h, m] = hora24.split(':').map(Number);
    const ampm = h >= 12 ? 'PM' : 'AM';
    const hrs = h % 12 || 12;

    return `${String(hrs).padStart(2, '0')}:${String(m).padStart(2, '0')} ${ampm}`;
}

function formatearTiempoTranscurrido(minutos) {
    if (minutos < 60) {
        return `${minutos} minuto${minutos === 1 ? '' : 's'}`;
    }

    const horas = Math.floor(minutos / 60);
    const resto = minutos % 60;

    if (resto === 0) {
        return `${horas} hora${horas === 1 ? '' : 's'}`;
    }

    return `${horas} h y ${resto} min`;
}

function guardarDatos() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(datos));
        return true;

    } catch (e) {
        alert(
            'No se pudo guardar. El almacenamiento del navegador ' +
            'está lleno; prueba con una captura más pequeña.'
        );

        return false;
    }
}

function procesarYAgregarDato() {
    const jugador = $('jugadorInput').value.trim();
    const hora = $('horaInput').value;
    const tipo = $('tipoPez').value;
    const valorTexto = $('valorInput').value.trim();
    const valor = Number(valorTexto);
    const archivo = $('fotoInput').files[0];

    if (
        !jugador ||
        !hora ||
        valorTexto === '' ||
        !Number.isSafeInteger(valor) ||
        valor < 0
    ) {
        alert(
            'Completa el nombre, la hora y los puntos con un ' +
            'número entero igual o mayor que cero.'
        );
        return;
    }

    if (archivo && !archivo.type.startsWith('image/')) {
        alert('El archivo seleccionado no es una imagen.');
        return;
    }

    const registrar = foto => {
        const nuevo = {
            jugador,
            hora,
            tipo,
            valor,
            foto,
            creado: Date.now()
        };

        datos.push(nuevo);

        if (!guardarDatos()) {
            datos.pop();
            return;
        }

        limpiarFormulario();
        actualizarPantalla();
    };

    if (archivo) {
        if (archivo.size > 1.5 * 1024 * 1024) {
            alert(
                'La imagen supera 1.5 MB. Recórtala o reduce ' +
                'su tamaño antes de subirla.'
            );
            return;
        }

        const lector = new FileReader();

        lector.onload = e => {
            registrar(
                typeof e.target.result === 'string'
                    ? e.target.result
                    : PLACEHOLDER_IMAGE
            );
        };

        lector.onerror = () => {
            alert(
                'No se pudo leer la imagen. Intenta seleccionarla otra vez.'
            );
        };

        lector.readAsDataURL(archivo);

    } else {
        registrar(PLACEHOLDER_IMAGE);
    }
}

function limpiarFormulario() {
    $('jugadorInput').value = '';
    $('valorInput').value = '';
    $('fotoInput').value = '';
    $('jugadorInput').focus();
}

function crearTexto(tag, texto, clase) {
    const el = document.createElement(tag);
    el.textContent = texto;

    if (clase) {
        el.className = clase;
    }

    return el;
}

function actualizarPantalla() {
    const lista = $('listaHistorial');
    const prediccion = $('prediccionBox');

    const filtro = $('buscadorInput')
        .value.trim().toLocaleLowerCase();

    lista.replaceChildren();

    const filtrados = datos
        .filter(item =>
            item.jugador.toLocaleLowerCase().includes(filtro)
        )
        .slice()
        .sort((a, b) => (b.creado || 0) - (a.creado || 0));

    if (!filtrados.length) {
        lista.appendChild(
            crearTexto('li', 'No hay registros que coincidan.', 'empty')
        );

    } else {
        const suma = filtrados.reduce(
            (total, item) => total + item.valor,
            0
        );

        if (filtro) {
            const resumen = document.createElement('li');
            resumen.className = 'record';

            resumen.appendChild(
                crearTexto(
                    'span',
                    `📈 Rendimiento de "${filtro}": ` +
                    `${suma.toLocaleString()} puntos en ` +
                    `${filtrados.length} registro(s).`
                )
            );

            lista.appendChild(resumen);
        }

        filtrados.forEach(item => {
            const li = document.createElement('li');
            li.className = 'record';

            const img = document.createElement('img');
            img.className = 'captured-preview';
            img.alt = 'Captura de la ronda';
            img.src = item.foto || PLACEHOLDER_IMAGE;

            const info = document.createElement('div');
            info.className = 'info-container';

            const nombre = document.createElement('span');
            nombre.append('👤 Jugador: ');

            const b = document.createElement('b');
            b.textContent = item.jugador;
            b.style.color = '#818cf8';

            nombre.appendChild(b);

            const hora = document.createElement('span');
            hora.append(
                `⏰ Hora: ${convertirAMPM(item.hora)} | `
            );

            hora.appendChild(
                crearTexto('span', item.tipo, `badge ${item.tipo}`)
            );

            const puntos = document.createElement('span');
            puntos.append('🎯 Puntos obtenidos: ');

            const p = crearTexto(
                'b',
                `${item.valor.toLocaleString()} pts`,
                'highlight'
            );

            puntos.appendChild(p);

            info.append(nombre, hora, puntos);
            li.append(img, info);
            lista.appendChild(li);
        });
    }

    actualizarPrediccion(prediccion);
}

function actualizarPrediccion(caja) {
    if (datos.length < 2) {
        caja.textContent =
            'Ingresa al menos 2 registros para estimar el intervalo entre rondas.';
        return;
    }

    const anteriores = datos
        .slice()
        .sort((a, b) => (a.creado || 0) - (b.creado || 0));

    const penultimo = anteriores[anteriores.length - 2];
    const ultimo = anteriores[anteriores.length - 1];

    const a = penultimo.hora.split(':').map(Number);
    const b = ultimo.hora.split(':').map(Number);

    let min1 = a[0] * 60 + a[1];
    let min2 = b[0] * 60 + b[1];

    if (min2 < min1) {
        min2 += 1440;
    }

    const diferencia = min2 - min1;
    const prox = (min2 + diferencia) % 1440;

    const proxHora =
        `${String(Math.floor(prox / 60)).padStart(2, '0')}:` +
        `${String(prox % 60).padStart(2, '0')}`;

    const promedio = Math.round(
        (penultimo.valor + ultimo.valor) / 2
    );

    caja.replaceChildren();

    caja.appendChild(
        crearTexto(
            'div',
            '🔮 Estimación basada únicamente en los dos últimos registros:'
        )
    );

    const ul = document.createElement('ul');

    [
        `Intervalo entre los dos últimos tiros: ${formatearTiempoTranscurrido(diferencia)}.`,
        `Si el intervalo se repitiera, la siguiente hora estimada sería: ${convertirAMPM(proxHora)}.`,
        `Promedio de puntos de esos dos registros: ${promedio.toLocaleString()} pts.`
    ].forEach(t => {
        ul.appendChild(crearTexto('li', t));
    });

    caja.appendChild(ul);

    caja.appendChild(
        crearTexto(
            'p',
            'Importante: es una estimación matemática simple, ' +
            'no garantiza ni predice resultados futuros.'
        )
    );
}

function borrarDatos() {
    const confirmar = confirm(
        '¿Seguro que quieres borrar todos los registros guardados ' +
        'en este navegador? Esta acción no se puede deshacer.'
    );

    if (!confirmar) return;

    const copia = datos;
    datos = [];

    try {
        localStorage.removeItem(STORAGE_KEY);
        actualizarPantalla();

    } catch (e) {
        datos = copia;
        alert('No se pudieron borrar los datos del navegador.');
    }
}

$('agregarBtn').addEventListener(
    'click',
    procesarYAgregarDato
);

$('borrarBtn').addEventListener(
    'click',
    borrarDatos
);

$('buscadorInput').addEventListener(
    'input',
    actualizarPantalla
);

actualizarPantalla();
</script>

</body>
</html>
