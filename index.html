<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Analizador Estadístico de Jugadores y Multiplicadores</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #1a1a24; color: #e2e8f0; margin: 0; padding: 20px; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1100px; margin: 0 auto; }
        .panel { background: #242538; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { text-align: center; margin-bottom: 30px; color: #f8fafc; }
        h2 { margin-top: 0; color: #6366f1; border-bottom: 2px solid #313244; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #94a3b8; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #3b3d54; background: #1c1d2c; color: white; box-sizing: border-box; }
        input[type="file"] { padding: 5px; cursor: pointer; }
        button { width: 100%; background-color: #6366f1; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 1em; margin-bottom: 10px; transition: 0.2s; }
        button:hover { background-color: #4f46e5; }
        .btn-danger { background-color: #ef4444; }
        .btn-danger:hover { background-color: #dc2626; }
        ul { list-style: none; padding: 0; max-height: 350px; overflow-y: auto; }
        li { background: #1c1d2c; padding: 12px; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid #6366f1; display: flex; align-items: center; gap: 15px; }
        .captured-preview { width: 90px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid #3b3d54; background: #242538; }
        .badge { font-weight: bold; padding: 4px 8px; border-radius: 4px; color: #000; display: inline-block; }
        .Rojo { background: #f87171; } .Naranja { background: #fb923c; } .Azul { background: #60a5fa; }
        .prediction-box { background: #1c1d2c; padding: 15px; border-radius: 8px; border-left: 5px solid #10b981; font-size: 1.1em; line-height: 1.6; margin-bottom: 15px; }
        .search-box { background: #1c1d2c; border: 1px solid #6366f1; padding: 12px; margin-bottom: 15px; font-size: 1em; }
        .highlight { color: #34d399; font-weight: bold; }
        .info-container { display: flex; flex-direction: column; gap: 4px; width: 100%; }
    </style>
</head>
<body>

<h1>📊 Analizador Estadístico de Rondas y Multiplicadores</h1>

<div class="dashboard">
    <!-- COLUMNA IZQUIERDA: FORMULARIO -->
    <div class="panel">
        <h2>📥 Registrar Ronda Ejecutada</h2>
        
        <div class="form-group">
            <label>Nombre del Jugador / Personaje (Ej. Mickey, Chica):</label>
            <input type="text" id="jugadorInput" placeholder="Escribe quién jugó esta ronda" required>
        </div>

        <div class="form-group">
            <label>Hora exacta del tiro:</label>
            <input type="time" id="horaInput" value="07:00">
        </div>
        
        <div class="form-group">
            <label>Tipo de Multiplicador Obtenido:</label>
            <select id="tipoPez">
                <option value="Rojo">Multiplicador Rojo 🔴</option>
                <option value="Naranja">Multiplicador Naranja 🟠</option>
                <option value="Azul">Multiplicador Azul 🔵</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Puntos Totales Conseguidos:</label>
            <input type="number" id="valorInput" placeholder="Ej. 1500" required>
        </div>

        <div class="form-group">
            <label>Subir captura de pantalla de la ronda (Evidencia):</label>
            <input type="file" id="fotoInput" accept="image/*">
        </div>

        <button type="button" onclick="procesarYAgregarDato()">Ingresar al Registro</button>
        <button type="button" class="btn-danger" onclick="borrarDatos()">⚠️ Reiniciar Base de Datos</button>
    </div>
    
    <!-- COLUMNA DERECHA: RESULTADOS Y FILTROS -->
    <div class="panel">
        <h2>🔮 Predicción General del Patrón</h2>
        <div class="prediction-box" id="prediccionBox">
            Ingresa al menos 2 registros generales para calcular tiempos.
        </div>
        
        <h2>🔍 Filtrar Historial por Jugador</h2>
        <input type="text" id="buscadorInput" class="search-box" placeholder="🔎 Escribe un nombre (ej: Mickey) para ver solo sus puntos..." oninput="actualizarPantalla()">
        
        <ul id="listaHistorial"></ul>
    </div>
</div>

<script>
    let datos = JSON.parse(localStorage.getItem('analisisJugadoresMultiplicadores')) || [];

    // Mostrar datos al cargar la página directamente
    actualizarPantalla();

    function convertirAMPM(hora24) {
        if (!hora24) return "";
        let [hrs, mins] = hora24.split(':').map(Number);
        let ampm = hrs >= 12 ? 'PM' : 'AM';
        hrs = hrs % 12; hrs = hrs ? hrs : 12;
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')} ${ampm}`;
    }

    function formatearTiempoTranscurrido(minutosTotales) {
        if (minutosTotales < 60) return `${minutosTotales} minutos`;
        let horas = Math.floor(minutosTotales / 60);
        let minutosRestantes = minutosTotales % 60;
        return minutosRestantes === 0 ? `${horas} horas` : `${horas} h y ${minutosRestantes} min`;
    }

    function procesarYAgregarDato() {
        const jugador = document.getElementById('jugadorInput').value.trim();
        const hora = document.getElementById('horaInput').value;
        const tipo = document.getElementById('tipoPez').value;
        const valor = parseInt(document.getElementById('valorInput').value);
        const archivoFoto = document.getElementById('fotoInput').files;

        if (!jugador || !hora || isNaN(valor)) {
            alert("Por favor rellena el nombre del jugador, la hora y los puntos.");
            return;
        }

        if (archivoFoto && archivoFoto.length > 0) {
            const lector = new FileReader();
            lector.onload = function(e) {
                guardarRegistro(jugador, hora, tipo, valor, e.target.result);
            };
            lector.readAsDataURL(archivoFoto[0]);
        } else {
            const fotoPorDefecto = 'https://icons8.com';
            guardarRegistro(jugador, hora, tipo, valor, fotoPorDefecto);
        }
    }

    function guardarRegistro(jugador, hora, tipo, valor, fotoUrl) {
        datos.push({ jugador, hora, tipo, valor, foto: fotoUrl });
        datos.sort((a, b) => a.hora.localeCompare(b.hora));

        try {
            localStorage.setItem('analisisJugadoresMultiplicadores', JSON.stringify(datos));
            actualizarPantalla();
            
            document.getElementById('valorInput').value = '';
            document.getElementById('fotoInput').value = '';
            document.getElementById('jugadorInput').value = '';
        } catch (e) {
            alert("⚠️ La captura es muy pesada. Reduce la resolución o recórtala un poco antes de subirla.");
        }
    }

    function actualizarPantalla() {
        const lista = document.getElementById('listaHistorial');
        const prediccion = document.getElementById('prediccionBox');
        const filtroNombre = document.getElementById('buscadorInput').value.trim().toLowerCase();
        
        lista.innerHTML = '';
        let datosFiltrados = datos.filter(item => item.jugador.toLowerCase().includes(filtroNombre));

        if (datosFiltrados.length === 0) {
            lista.innerHTML = '<li>No hay registros en la lista.</li>';
        } else {
            let sumaPuntosFiltrados = datosFiltrados.reduce((sum, item) => sum + item.valor, 0);
            
            datosFiltrados.forEach(item => {
                const horaLegible = convertirAMPM(item.hora);
                lista.innerHTML += `
                    <li>
                        <img src="${item.foto}" class="captured-preview" alt="Ronda">
                        <div class="info-container">
                            <span>👤 Jugador: <b style="color:#6366f1; font-size:1.1em;">${item.jugador}</b></span>
                            <span>⏰ Hora: <b>${horaLegible}</b> &nbsp;|&nbsp; <span class="badge ${item.tipo}">${item.tipo}</span></span>
                            <span>🎯 Puntos obtenidos: <span style="color:#34d399; font-weight:bold;">${item.valor} pts</span></span>
                        </div>
                    </li>`;
            });
            
            if (filtroNombre !== "") {
                lista.insertAdjacentHTML('afterbegin', `<li style="background: #2e304e; border-left-color: #a5b4fc;">📈 <b>Rendimiento de "${filtroNombre}":</b> Acumula <span class="highlight">${sumaPuntosFiltrados} pts</span>.</li>`);
            }
        }

        if (datos.length < 2) return;

        const penultimo = datos[datos.length - 2];
        const ultimo = datos[datos.length - 1];
        const [h1, m1] = penultimo.hora.split(':').map(Number);
        const [h2, m2] = ultimo.hora.split(':').map(Number);
        
        let min1 = h1 * 60 + m1; let min2 = h2 * 60 + m2;
        if (min2 < min1) min2 += 1440; 
        
        let diferencia = min2 - min1;
        let proximoTiempo = min2 + diferencia;
        let proxH = Math.floor((proximoTiempo % 1440) / 60);
        let proxM = proximoTiempo % 60;
        let horaEstimadaAMPM = convertirAMPM(`${String(proxH).padStart(2,'0')}:${String(proxM).padStart(2,'0')}`);
        let tiempoLegible = formatearTiempoTranscurrido(diferencia);
        let valorEstimado = Math.round((penultimo.valor + ultimo.valor) / 2);

        prediccion.innerHTML = `
            🔮 <b>Patrón General de Tiempos:</b><br>
            • Tiempo transcurrido entre los últimos tiros: <span class="highlight">${tiempoLegible}</span>.<br>
